{% extends 'core/base.html' %}
{% load static %}
{% block title %}BAST Records{% endblock %}

{% block content %}
<div class="form-container">
    <h1 class="page-header">BAST Records</h1>
    <div class="container-fluid mt-4">
        <div class="d-flex justify-content-end mb-4">
            <a href="{% url 'bast:bastrecord_create' %}" class="btn btn-primary">
                <i class="fas fa-plus me-1"></i> Create New Record
            </a>
        </div>
        {% include 'core/includes/record_table.html' %}
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'core/js/record_table.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const urls = {
            edit: '{% url "bast:bastrecord_update" 0 %}',
            delete: '{% url "bast:bastrecord_delete_direct" 0 %}',
        };
        const orDash = (cell) => RecordTable.escapeHtml(cell.getValue() || '-');
        RecordTable.create({
            url: '{% url "api:bast:record_list" %}',
            urls,
            csrfToken: '{{ csrf_token }}',
            pageSize: 10,
            columns: [
                { title: 'BAST ID', field: 'code', hozAlign: 'center', headerHozAlign: 'center' },
                { title: 'Petugas', field: 'operator_name', headerHozAlign: 'center', formatter: orDash },
                { title: 'SPV', field: 'supervisor_name', headerHozAlign: 'center' },
                RecordTable.actionsColumn(urls),
            ],
        });
    });
</script>
{% endblock %}
